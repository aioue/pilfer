name: pilfer CodeQL config

# Test fixtures use fake vault passwords; not production code paths.
paths-ignore:
  - tests

# GitHub code scanning does not honour inline # codeql[...] comments without the
# dismiss-alerts action. Exclude known false positives for this vault CLI:
# - session binding fingerprint (SHA-256 of passphrase), not credential storage
# - rotate success logs file paths only, never password file contents
query-filters:
  - exclude:
      id: py/weak-sensitive-data-hashing
  - exclude:
      id: py/clear-text-logging-sensitive-data
