name: pilfer CodeQL config

# Test fixtures use fake vault passwords; not production code paths.
paths-ignore:
  - tests

# Default setup needs an explicit suite before query-filters apply (paths-ignore alone
# is picked up without this). Exclude vault-CLI false positives:
# - session binding SHA-256 digest, not credential storage
# - rotate success logs file paths only, never password file contents
queries:
  - uses: security-and-quality

query-filters:
  - exclude:
      id: py/weak-sensitive-data-hashing
  - exclude:
      id: py/clear-text-logging-sensitive-data
