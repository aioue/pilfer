name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate release version
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            EXPECTED_VERSION="${TAG#v}"
          else
            EXPECTED_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
            echo "Manual release using pyproject.toml version ${EXPECTED_VERSION}"
          fi

          PYPROJECT_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          INIT_VERSION="$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('pilfer/__init__.py').read()).group(1))")"
          STANDALONE_VERSION="$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('pilfer.py').read()).group(1))")"

          echo "Expected version: ${EXPECTED_VERSION}"
          echo "pyproject.toml:   ${PYPROJECT_VERSION}"
          echo "pilfer/__init__.py: ${INIT_VERSION}"
          echo "pilfer.py:        ${STANDALONE_VERSION}"

          for label in pyproject pilfer/__init__.py pilfer.py; do
            case "${label}" in
              pyproject) actual="${PYPROJECT_VERSION}" ;;
              pilfer/__init__.py) actual="${INIT_VERSION}" ;;
              pilfer.py) actual="${STANDALONE_VERSION}" ;;
            esac
            if [[ "${actual}" != "${EXPECTED_VERSION}" ]]; then
              echo "::error::${label} version (${actual}) does not match release version (${EXPECTED_VERSION})"
              exit 1
            fi
          done

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${EXPECTED_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must match pyproject.toml version v${EXPECTED_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible build twine ruff
          pip install -e .

      - name: Ruff
        run: ruff check pilfer/ pilfer.py tests/

      - name: Run tests
        run: |
          cd tests
          python run_tests.py

      - name: Verify standalone script
        run: python pilfer.py --version

      - name: Verify packaged CLI
        run: pilfer --version

  build:
    name: Build distributions
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/

      - name: Build release body
        id: notes
        run: |
          set -euo pipefail
          BODY_FILE="${RUNNER_TEMP}/release-body.md"
          ./scripts/release-notes.sh > "${BODY_FILE}"
          echo "body_file=${BODY_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ steps.notes.outputs.body_file }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  pypi-publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  record-pypi-deployment:
    name: Record PyPI deployment
    needs: pypi-publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pilfer
    steps:
      - name: Record successful PyPI publish
        run: echo "Published to https://pypi.org/project/pilfer/"
