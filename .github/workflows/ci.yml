name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only PR runs cancel an older run: a cancelled run on master shows as
  # failing on the README badge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Quick Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The keyring extra is a test dependency; pyproject holds the version floor.
          pip install -e '.[keyring]'
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check pilfer/ pilfer.py tests/

      - name: Run tests
        run: |
          cd tests
          python run_tests.py

      - name: Test standalone script
        run: python pilfer.py --version
