name: Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Continue testing other versions if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ansible  # Required for VaultLib
        pip install -e .     # Install pilfer in development mode
        
    - name: Verify installation
      run: |
        python -c "import pilfer.cli; print('CLI import successful')"
        python pilfer.py --version
        
    - name: Run tests
      run: |
        cd tests
        python run_tests.py
        
    - name: Run individual test classes (for debugging)
      if: failure()  # Only run if main tests failed
      run: |
        cd tests
        echo "Running CLI tests separately..."
        python -m unittest test_pilfer_unified.TestPilferCLI -v
        echo "Running standalone tests separately..."
        python -m unittest test_pilfer_unified.TestPilferStandalone -v
        echo "Running compatibility tests separately..."
        python -m unittest test_pilfer_unified.TestCompatibility -v

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        
    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-lint-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-lint-
          
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Ruff
      run: ruff check pilfer/ pilfer.py tests/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        
    - name: Install Bandit
      run: |
        python -m pip install --upgrade pip
        pip install "bandit[toml,sarif]>=1.8,<2"
        
    - name: Run Bandit
      run: bandit -r pilfer/ pilfer.py -c pyproject.toml -ll -f sarif -o bandit.sarif
        
    - name: Upload Bandit SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: success()
      with:
        sarif_file: bandit.sarif
        category: bandit

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        
    - name: Install dependencies with coverage
      run: |
        python -m pip install --upgrade pip
        pip install ansible coverage
        pip install -e .
        
    - name: Run tests with coverage
      run: |
        cd tests
        coverage run --source=../pilfer run_tests.py
        coverage report --show-missing
        coverage html
        
    - name: Upload coverage reports
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: tests/htmlcov/ 
