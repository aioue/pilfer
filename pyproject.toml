[build-system]
requires = ["setuptools>=45.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pilfer"
version = "2.24.2"
authors = [
    {name = "Tom Paine", email = "github@aioue.net"},
]
description = "CLI to bulk decrypt/re-encrypt Ansible vault files in a project tree for editing."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["PILFER_LICENSE.txt"]

requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "ansible>=2.9.0",
]
keywords = [
    "ansible",
    "ansible-vault",
    "vault",
    "secrets",
    "secrets-management",
    "encryption",
    "decrypt",
    "encrypt",
    "rekey",
    "devops",
    "automation",
    "infrastructure",
    "cli",
    "yaml",
]

[project.urls]
Homepage = "https://github.com/aioue/pilfer"
Documentation = "https://github.com/aioue/pilfer#readme"
Repository = "https://github.com/aioue/pilfer"
Issues = "https://github.com/aioue/pilfer/issues"
Changelog = "https://github.com/aioue/pilfer/releases"

[project.scripts]
pilfer = "pilfer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pilfer*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
# Intentional best-effort cleanup paths (same policy as ruff SIM105 ignore).
skips = ["B110"]
