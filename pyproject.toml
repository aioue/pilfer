[build-system]
requires = ["setuptools>=45.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pilfer"
version = "2.32.0"
authors = [
    {name = "Tom Paine", email = "github@aioue.net"},
]
description = "CLI to bulk decrypt/re-encrypt Ansible vault files in a project tree for editing."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["PILFER_LICENSE.txt"]

# ansible-core 2.21, the oldest core pilfer supports, needs 3.12.
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    # Core only: pilfer imports nothing from the collections in `ansible`.
    # 2.21 is the floor CI tests: CLI.setup_vault_secrets(initialize_context=)
    # and VaultHelper are recent. No upper bound; CI also tests the latest core.
    "ansible-core>=2.21",
]
keywords = [
    "ansible",
    "ansible-vault",
    "vault",
    "secrets",
    "secrets-management",
    "encryption",
    "decrypt",
    "encrypt",
    "rekey",
    "devops",
    "automation",
    "infrastructure",
    "cli",
    "yaml",
]

[project.optional-dependencies]
# pilfer-vault-keyring-client: macOS Keychain or Secret Service via keyring
# (ansible-core has no Windows controller).
keyring = ["keyring>=25"]

[project.urls]
Homepage = "https://aioue.net/2026/08/07/pilfer-bulk-ansible-vault-edit/"
Documentation = "https://aioue.net/2026/08/07/pilfer-bulk-ansible-vault-edit/"
Repository = "https://github.com/aioue/pilfer"
Issues = "https://github.com/aioue/pilfer/issues"
Changelog = "https://github.com/aioue/pilfer/releases"

[project.scripts]
pilfer = "pilfer.cli:main"
# Ansible passes --vault-id only to a password script whose name ends in -client.
pilfer-vault-keyring-client = "pilfer.keyring_client:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pilfer*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
# Intentional best-effort cleanup paths (same policy as ruff SIM105 ignore).
skips = ["B110"]
